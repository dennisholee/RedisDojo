services:
  redis:
    container_name: redisdojo-02_springredis
    image: redis/redis-stack:edge
    volumes:
      - ./redisdata:/data
    environment:
      - REDIS_ARGS=--appendonly yes --save ""
    ports:
      - "6379:6379"
      - "8001:8001"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure